# Publishes a static export of app/ to GitHub Pages so the tracker has a live
# demo URL. Deliberately kept on this branch only, so the homework PR's diff
# stays limited to the assignment itself.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [deploy/github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The lockfile is generated on Windows, so npm never resolved the
      # linux/wasm32 optional deps of sharp into it. The static export sets
      # images.unoptimized, so sharp is not used at all here - skipping
      # optional deps sidesteps the whole class of problem. The fallback keeps
      # the demo deploy green if the lockfile drifts again.
      - name: Install dependencies
        run: npm ci --omit=optional || npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          # Turns on output: 'export' + basePath in next.config.ts.
          GITHUB_PAGES: 'true'

      # Pages serves the artifact as-is; without this, Jekyll strips _next/.
      - run: touch out/.nojekyll

      # enablement turns Pages on through the API using this workflow's own
      # pages:write token, so no manual Settings -> Pages step is required.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
